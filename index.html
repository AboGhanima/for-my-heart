<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إلى أقربهم إلى قلبي</title>
    
    <!-- خط Amiri الكلاسيكي/العثماني -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }

        body {
            background-color: #fcf8f2;
            color: #4a2e2b;
            font-family: 'Amiri', serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
            cursor: pointer;
        }

        /* خلفية ورود وزهور ناعمة */
        .flower {
            position: absolute;
            font-size: 2rem;
            opacity: 0.15;
            animation: float 6s ease-in-out infinite alternate;
            pointer-events: none;
        }

        @keyframes float {
            0% { transform: translateY(0) rotate(0deg); }
            100% { transform: translateY(-20px) rotate(15deg); }
        }

        .container {
            text-align: center;
            z-index: 10;
            padding: 20px;
            max-width: 800px;
            width: 100%;
        }

        /* انيميشن الظهور للترحيب */
        .welcome-screen {
            opacity: 0;
            transform: translateY(20px);
            animation: fadeIn 2s cubic-bezier(0.4, 0, 0.2, 1) forwards;
        }

        .welcome-title {
            font-size: 4rem;
            color: #8b3a42;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.05);
        }

        /* شاشة الشعر */
        .poem-screen {
            display: none;
            opacity: 0;
            transition: opacity 1s ease-in;
        }

        .poem-screen.active {
            display: block;
            opacity: 1;
        }

        .poem-verse {
            font-size: 2.2rem;
            line-height: 2.2;
            color: #5c2427;
            margin: 15px 0;
            min-height: 2.2em; /* للحفاظ على أبعاد السطر قبل الكتابة */
            position: relative;
            display: inline-block;
            width: 100%;
        }

        /* مؤشر الكتابة (Cursor) */
        .cursor {
            display: inline-block;
            width: 2px;
            height: 1.2em;
            background-color: #8b3a42;
            vertical-align: middle;
            margin-right: 4px;
            animation: blink 0.8s infinite;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }

        /* زهرة تفاعلية تظهر عند الضغط */
        .click-flower {
            position: absolute;
            pointer-events: none;
            font-size: 1.8rem;
            animation: popAndFade 1.2s forwards ease-out;
            z-index: 100;
        }

        @keyframes fadeIn {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes popAndFade {
            0% { opacity: 1; transform: scale(0.5) translateY(0); }
            100% { opacity: 0; transform: scale(1.5) translateY(-40px); }
        }
    </style>
</head>
<body>

    <!-- خلفية زهور مبعثرة -->
    <div class="flower" style="top: 10%; left: 10%;">🌸</div>
    <div class="flower" style="top: 20%; right: 15%; animation-delay: 1s;">🌹</div>
    <div class="flower" style="bottom: 15%; left: 20%; animation-delay: 2s;">🌺</div>
    <div class="flower" style="bottom: 10%; right: 10%; animation-delay: 1.5s;">🌷</div>
    <div class="flower" style="top: 50%; left: 5%; animation-delay: 0.5s;">💐</div>
    <div class="flower" style="top: 40%; right: 5%; animation-delay: 2.5s;">🌸</div>

    <div class="container">
        <!-- شاشة الترحيب -->
        <div id="welcomeScreen" class="welcome-screen">
            <h1 class="welcome-title">أهلاً حلا</h1>
        </div>

        <!-- شاشة الشعر -->
        <div id="poemScreen" class="poem-screen">
            <div class="poem-verse" id="verse1"></div>
            <div class="poem-verse" id="verse2"></div>
            <div class="poem-verse" id="verse3"></div>
            <div class="poem-verse" id="verse4"></div>
        </div>
    </div>

    <script>
        const poemLines = [
            "أَتَت وَحَلا الحَياةُ بِقُربِها",
            "فَصارَت بِقَلبِيَ أَغلى المُنَى",
            "كأنّ العُيُونَ إِذا ما رَأَتكِ",
            "تَرَى الفَجرَ يَبتَسِمُ المُنتَهَى"
        ];

        let hasClicked = false;

        document.body.addEventListener('click', function(e) {
            createClickFlower(e.clientX, e.clientY);

            if (hasClicked) return;
            hasClicked = true;

            const welcomeScreen = document.getElementById('welcomeScreen');
            const poemScreen = document.getElementById('poemScreen');

            welcomeScreen.style.transition = 'opacity 1s ease';
            welcomeScreen.style.opacity = '0';

            setTimeout(() => {
                welcomeScreen.style.display = 'none';
                poemScreen.classList.add('active');
                
                // البدء في كتابة الشعر سطراً تلو الآخر
                typePoem(0);
            }, 1000);
        });

        // دالة الكتابة الحية (Typewriter)
        function typePoem(lineIndex) {
            if (lineIndex >= poemLines.length) return;

            const targetElement = document.getElementById(`verse${lineIndex + 1}`);
            const text = poemLines[lineIndex];
            let charIndex = 0;

            // إضافة مؤشر الكتابة للسطر الحالي
            const cursor = document.createElement('span');
            cursor.className = 'cursor';
            targetElement.appendChild(cursor);

            const typingInterval = setInterval(() => {
                if (charIndex < text.length) {
                    // إدراج الحرف قبل مؤشر الكتابة مباشرة
                    cursor.insertAdjacentText('beforebegin', text.charAt(charIndex));
                    charIndex++;
                } else {
                    clearInterval(typingInterval);
                    // إزالة المؤشر من السطر المكتمل
                    cursor.remove();
                    // الانتقال للسطر التالي بعد تأخير بسيط
                    setTimeout(() => {
                        typePoem(lineIndex + 1);
                    }, 400);
                }
            }, 90); // السرعة بين كل حرف (90 ملي ثانية)
        }

        function createClickFlower(x, y) {
            const flowers = ['🌸', '🌹', '🌺', '✨', '🌷'];
            const flower = document.createElement('div');
            flower.className = 'click-flower';
            flower.innerText = flowers[Math.floor(Math.random() * flowers.length)];
            flower.style.left = `${x - 15}px`;
            flower.style.top = `${y - 15}px`;
            
            document.body.appendChild(flower);

            setTimeout(() => {
                flower.remove();
            }, 1200);
        }
    </script>
</body>
</html>
